name: Build Meisam VPN Android APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Official Gradle 8.5
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.5-bin.zip
          unzip -q gradle-8.5-bin.zip -d /opt
          echo "/opt/gradle-8.5/bin" >> $GITHUB_PATH

      - name: Build Android Debug APK
        run: |
          gradle --version
          cd android
          gradle assembleDebug --stacktrace --no-daemon

      - name: Prepare APK Output
        run: |
          mkdir -p output_apk
          cp android/app/build/outputs/apk/debug/*.apk output_apk/Meisam_VPN_v3.5.apk
          ls -la output_apk/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Meisam_VPN_Android_v3.5
          path: output_apk/Meisam_VPN_v3.5.apk
          retention-days: 30
