name: Build Meisam VPN Android APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Official Gradle 8.5
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.5-bin.zip
          unzip -q gradle-8.5-bin.zip -d /opt
          echo "/opt/gradle-8.5/bin" >> $GITHUB_PATH

      - name: Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Build Android Debug APK
        run: |
          gradle --version
          cd android
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          gradle assembleDebug --stacktrace --no-daemon > build_log.txt 2>&1 || true
          cat build_log.txt
          test -f app/build/outputs/apk/debug/*.apk

      - name: Push Build Log to Repo
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -f android/build_log.txt ]; then
            cp android/build_log.txt ./LAST_BUILD_LOG.txt
            git add LAST_BUILD_LOG.txt
            git commit -m "chore: save build log [skip ci]" || true
            git push origin main || true
          fi

      - name: Prepare APK Output
        run: |
          mkdir -p output_apk
          find android -name "*.apk" -exec cp -v {} output_apk/Meisam_VPN_v3.5.apk \;
          ls -la output_apk/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Meisam_VPN_Android_v3.5
          path: output_apk/Meisam_VPN_v3.5.apk
          retention-days: 30
