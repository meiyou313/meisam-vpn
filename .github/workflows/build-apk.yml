name: Build Meisam VPN Android APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Android Debug APK
        run: |
          cd android
          gradle assembleDebug --stacktrace --no-daemon

      - name: Rename APK for Easy Identification
        run: |
          mkdir -p output_apk
          cp android/app/build/outputs/apk/debug/*.apk output_apk/Meisam_VPN_v3.5.apk
          ls -la output_apk/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Meisam_VPN_Android_v3.5
          path: output_apk/Meisam_VPN_v3.5.apk
          retention-days: 30

      - name: Create Release (Optional on Tags)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: output_apk/Meisam_VPN_v3.5.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
