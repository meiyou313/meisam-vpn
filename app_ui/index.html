<body>
<main class="app" id="app">
  <header>
    <div class="logo" aria-hidden="true">
      <svg viewBox="0 0 48 48" fill="none">
        <defs><linearGradient id="mvBg" x1="6" y1="2" x2="44" y2="48" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#9185fa"/><stop offset="1" stop-color="#4436c8"/></linearGradient><linearGradient id="mvSh" x1="24" y1="8" x2="24" y2="41" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#d9d5ff"/></linearGradient></defs><rect width="48" height="48" rx="11.5" fill="url(#mvBg)"/><path d="M24 8.5 36.5 13v10.2c0 7.6-5.1 13.6-12.5 16.3-7.4-2.7-12.5-8.7-12.5-16.3V13z" fill="url(#mvSh)"/><path d="M17.5 29.5V19l6.5 6.5L30.5 19v10.5" stroke="#5043d6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="17.5" cy="19" r="2.4" fill="#5043d6"/><circle cx="30.5" cy="19" r="2.4" fill="#5043d6"/><circle cx="24" cy="25.5" r="2.4" fill="#5043d6"/>
        
      </svg>
    </div>
    <h1>Meisam VPN</h1>
  </header>

  <section class="hero" id="hero">
    <div class="stage">
      <svg class="rings" id="rings" viewBox="-600 -600 1200 1200" aria-hidden="true"></svg>
      <button class="power" id="power" aria-pressed="false" aria-label="Connect VPN">
        <svg viewBox="0 0 48 48" fill="none" stroke-width="4.6" stroke-linecap="round" aria-hidden="true">
          <path d="M24 4v16"/><path d="M14.5 11.5a17 17 0 1 0 19 0"/>
        </svg>
      </button>
    </div>
    <div class="status" aria-live="polite">
      <h2 id="state">Disconnected</h2>
      <p id="hint">Tap to connect</p>
    </div>
  </section>

  <div class="testwrap">
    <button class="testbtn" id="openTest">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 17a9 9 0 1 1 17 0"/><path d="M12 14l4-4.5"/><circle cx="12" cy="14.5" r="1.3"/></svg>
      Test connection
    </button>
  </div>

  <div class="cards">
    <button class="card loc" id="openLoc">
      <span class="flag" id="locFlag" role="img" aria-label="Selected location flag"></span>
      <span class="txt"><small>Location</small><b id="locName">United Kingdom</b></span>
      <svg class="chev" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg>
    </button>

<script>
// Wobbly concentric rings
(function(){
  var svg=document.getElementById('rings'),NS='http://www.w3.org/2000/svg';
  var rings=[[260,0,0,1,3,'core'],[318,.03,.02,.55,2],[372,.04,.03,.42,2],[432,.05,.035,.32,2],[492,.05,.04,.24,2],[556,.05,.04,.16,2]];
  rings.forEach(function(r,k){
    var R=r[0],a=r[1],b=r[2],pts=[];
    for(var i=0;i<=120;i++){
      var t=i/120*Math.PI*2,
          rr=R*(1+a*Math.sin(3*t+k*1.3)+b*Math.sin(2*t+k*.7+1));
      pts.push((i?'L':'M')+(rr*Math.cos(t)).toFixed(1)+' '+(rr*Math.sin(t)).toFixed(1));
    }
    var p=document.createElementNS(NS,'path');
    p.setAttribute('d',pts.join('')+'Z');
    p.setAttribute('stroke-width',r[4]);
    p.setAttribute('opacity',r[3]);
    if(r[5])p.setAttribute('class',r[5]);
    svg.appendChild(p);
  });
})();

// Connect / disconnect interaction
(function(){
  var app=document.getElementById('app'),btn=document.getElementById('power'),
      st=document.getElementById('state'),hint=document.getElementById('hint'),
      connected=false,busy=false;

  window.setVpnState = function(state, serverName){
    if(state === 'connecting'){
      busy = true; connected = false;
      app.classList.add('busy'); app.classList.remove('on');
      st.textContent = 'Connecting…'; hint.textContent = 'Please wait';
      btn.setAttribute('aria-pressed', 'false');
      btn.setAttribute('aria-label', 'Connecting to VPN');
    } else if(state === 'connected'){
      busy = false; connected = true;
      app.classList.remove('busy'); app.classList.add('on');
      st.textContent = 'Connected'; hint.textContent = 'Tap to disconnect';
      btn.setAttribute('aria-pressed', 'true');
      btn.setAttribute('aria-label', 'Disconnect VPN');
    } else { // disconnected
      busy = false; connected = false;
      app.classList.remove('busy', 'on');
      st.textContent = 'Disconnected'; hint.textContent = 'Tap to connect';
      btn.setAttribute('aria-pressed', 'false');
      btn.setAttribute('aria-label', 'Connect VPN');
    }
  };

  btn.addEventListener('click',function(){
    if(busy)return;
    if(window.pywebview && window.pywebview.api && window.pywebview.api.toggle_connect){
      window.pywebview.api.toggle_connect();
      return;
    }
    busy=true;
    app.classList.add('busy'); st.textContent=connected?'Disconnecting…':'Connecting…'; hint.textContent='Please wait';
    setTimeout(function(){
      connected=!connected; busy=false;
      app.classList.remove('busy'); app.classList.toggle('on',connected);
      btn.setAttribute('aria-pressed',connected);
      btn.setAttribute('aria-label',connected?'Disconnect VPN':'Connect VPN');
      st.textContent=connected?'Connected':'Disconnected';
      hint.textContent=connected?'Tap to disconnect':'Tap to connect';
    },1200);
  });
})();
// Connection test: tests every server in parallel, sorts the list live by lowest ping
(function(){
  var G=function(d,a,b,c){return 'linear-gradient('+d+','+a+' 0 33.3%,'+b+' 33.3% 66.6%,'+c+' 66.6%)'};
  var SERVERS=[
    {code:'gb-lnd',c:'United Kingdom',city:'London',base:50,f:'linear-gradient(180deg,#012169 0 33.3%,#c8102e 33.3% 66.6%,#fff 66.6%)'},
    {code:'nl',c:'Netherlands',city:'Amsterdam',base:45,f:G('180deg','#ae1c28','#fff','#21468b')},
    {code:'fr-prs',c:'France',city:'Paris',base:55,f:G('90deg','#0055a4','#fff','#ef4135')},
    {code:'us-va',c:'United States',city:'Virginia',base:110,f:'linear-gradient(180deg,#b22234 0 50%,#3c3b6e 50%)'},
    {code:'us-or',c:'United States',city:'Oregon',base:135,f:'linear-gradient(180deg,#b22234 0 50%,#3c3b6e 50%)'},
    {code:'sg',c:'Singapore',city:'Singapore',base:160,f:'linear-gradient(180deg,#ed2939 0 50%,#fff 50%)'},
    {code:'ru-spb',c:'Russia',city:'St. Petersburg',base:95,f:G('180deg','#fff','#0039a6','#d52b1e')}
  ];
  var $=function(id){return document.getElementById(id)};
  var scrim=$('scrim'),list=$('testList'),sub=$('testSub'),bar=$('testBar'),again=$('again'),useBtn=$('useFast'),openBtn=$('openTest'),closeBtn=$('closeTest'),openLoc=$('openLoc');
  var reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  var token=0,done=0,best=null,cur=SERVERS[0];

  function measurePing(s){
    var p;
    if(window.measurePingAsync){
      p = window.measurePingAsync(s.code || s.c);
    } else if(window.pywebview && window.pywebview.api && window.pywebview.api.measure_ping){
      p = window.pywebview.api.measure_ping(s.code || s.c).then(function(res){
        return (res && res.ok && res.ping > 0) ? res.ping : -1;
      });
    } else {
      p = Promise.resolve(-1);
    }
    var timeoutP = new Promise(function(res){
      setTimeout(function(){ res(-1); }, 6500);
    });
    return Promise.race([p.catch(function(){ return -1; }), timeoutP]);
  }

  SERVERS.forEach(function(s,i){
    s.i=i;
    var li=document.createElement('li');
    li.innerHTML='<button class="srv"><span class="fl"></span><span class="nm"><b></b><small></small></span><span class="cell"></span></button>';
    s.el=li;s.btn=li.firstChild;s.cell=li.querySelector('.cell');
    li.querySelector('.fl').style.background=s.f;
    li.querySelector('b').textContent=s.c;li.querySelector('small').textContent=s.city;
    s.btn.addEventListener('click',function(){ select(s); });
    list.appendChild(li);
  });
  cur.btn.classList.add('cur');
  $('locFlag').style.background=cur.f;
  $('locName').textContent=cur.c;

  function paint(s){
    if(s.ping === null){
      s.cell.innerHTML='<i class="spin"></i><span class="wait">Testing…</span>';
      return;
    }
    if(s.ping <= 0){
      s.cell.innerHTML='<i class="dot bad"></i><b class="ms bad">—</b>';
      s.btn.setAttribute('aria-label', s.c + ', ' + s.city + ', Offline');
      return;
    }
    var q = s.ping < 1200 ? 'good' : (s.ping < 2500 ? 'mid' : 'bad');
    s.cell.innerHTML = (s.fast ? '<em class="badge">Fastest</em>' : '') + '<i class="dot ' + q + '"></i><b class="ms ' + q + '">' + s.ping + ' ms</b>';
    s.btn.setAttribute('aria-label', s.c + ', ' + s.city + ', ' + s.ping + ' milliseconds');
  }

  function sortRows(animate){
    var order = SERVERS.slice().sort(function(a, b){
      var ap = (a.ping != null && a.ping > 0) ? a.ping : (a.ping === null ? 999998 : 999999);
      var bp = (b.ping != null && b.ping > 0) ? b.ping : (b.ping === null ? 999998 : 999999);
      if(ap === bp) return a.i - b.i;
      return ap - bp;
    });
    var before = SERVERS.map(function(s){ return s.el.getBoundingClientRect().top; });
    order.forEach(function(s){ list.appendChild(s.el); });
    if(animate && !reduce) {
      SERVERS.forEach(function(s, k){
        var dy = before[k] - s.el.getBoundingClientRect().top;
        if(dy) s.el.animate([{transform:'translateY(' + dy + 'px)'}, {transform:'none'}], {duration:360, easing:'cubic-bezier(.2,.8,.2,1)'});
      });
    }
    return order;
  }

  function progress(n){
    bar.style.width=(n/SERVERS.length*100)+'%';
    sub.textContent='Testing '+n+' of '+SERVERS.length+' servers…';
  }

  function finish(){
    var valid = SERVERS.filter(function(x){ return x.ping != null && x.ping > 0; });
    if(valid.length > 0){
      valid.sort(function(a, b){ return a.ping - b.ping; });
      best = valid[0];
      best.fast = true;
      paint(best);
      sub.textContent = 'Fastest: ' + best.c + ' · ' + best.ping + ' ms';
      useBtn.disabled = false;
    } else {
      best = null;
      sub.textContent = 'All servers timed out or offline';
      useBtn.disabled = true;
    }
    again.disabled = false;
  }

  function run(){
    var t=++token; done=0; best=null;
    SERVERS.forEach(function(s){ s.ping=null; s.fast=false; paint(s); s.btn.removeAttribute('aria-label'); });
    sortRows(false); list.scrollTop=0; progress(0);
    again.disabled=true; useBtn.disabled=true;
    SERVERS.forEach(function(s){
      measurePing(s).then(function(p){
        if(t !== token) return;
        s.ping = (p > 0) ? p : -1;
        done++;
        paint(s);
        sortRows(true);
        if(done >= SERVERS.length){ bar.style.width='100%'; finish(); } else progress(done);
      });
    });
  }

  function open(){scrim.classList.add('open');closeBtn.focus();setTimeout(run, 60);}
  function close(){token++;scrim.classList.remove('open');openBtn.focus()}
  function select(s){
    cur=s;SERVERS.forEach(function(x){x.btn.classList.toggle('cur',x===s)});
    $('locFlag').style.background=s.f;$('locName').textContent=s.c;close();
    if(window.pywebview && window.pywebview.api && window.pywebview.api.select_server){
      window.pywebview.api.select_server(s.code || s.c, s.c, s.city);
    }
  }

  window.setCurrentServer = function(code){
    for(var i=0; i<SERVERS.length; i++){
      if(SERVERS[i].code === code || SERVERS[i].c.toLowerCase() === code.toLowerCase()){
        select(SERVERS[i]);
        break;
      }
    }
  };

  openBtn.addEventListener('click',open);
  if(openLoc) openLoc.addEventListener('click', open);
  closeBtn.addEventListener('click',close);
  again.addEventListener('click',run);
  useBtn.addEventListener('click',function(){if(best)select(best)});
  scrim.addEventListener('click',function(e){if(e.target===scrim)close()});
  document.addEventListener('keydown',function(e){if(e.key==='Escape'&&scrim.classList.contains('open'))close()});
})();
// Data usage: bar charts for daily / weekly / monthly (Fresh install: past usage is 0 MB)
(function(){
  var $=function(id){return document.getElementById(id)};
  var MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  var WD=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  var reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  var raw=[],i;
  for(i=0;i<56;i++) raw.push(0);
  window.currentSessionMb = 0;

  function sum(a,b){var s=0;for(var j=a;j<b;j++)s+=raw[j];return s}
  function r1(x){return Math.round(x*10)/10}
  function dayDate(i){return new Date(2026,9,23-(55-i))}

  function fmt(mb){return mb>=1000?(mb/1000).toFixed(2)+' GB':(mb>=100?Math.round(mb):mb.toFixed(1))+' MB'}
  function ax(v){return v>=1000?(+(v/1000).toFixed(2))+' GB':(+v.toFixed(2))+' MB'}
  function nice(v){if(v<=0) return 5; var p=Math.pow(10,Math.floor(Math.log10(v))),m=[1,2,2.5,5,10];for(var k=0;k<m.length;k++)if(m[k]*p>=v)return m[k]*p;return 10*p}

  function build(r){
    var it=[],k;
    raw[55] = window.currentSessionMb || 0;
    if(r==='daily'){
      for(k=42;k<56;k++){var d=dayDate(k),md=MON[d.getMonth()]+' '+d.getDate();
        it.push({v:raw[k],l:String(d.getDate()),n:k===55?'Today, '+md:WD[d.getDay()]+', '+md})}
      return {it:it,avg:'Daily average',per:'Last 14 days'};
    }
    if(r==='weekly'){
      for(k=0;k<8;k++){var s=dayDate(k*7),e=dayDate(k*7+6),a=MON[s.getMonth()]+' '+s.getDate(),b=MON[e.getMonth()]+' '+e.getDate();
        it.push({v:r1(sum(k*7,k*7+7)),l:a,n:(k===7?'This week, ':'')+a+' – '+b})}
      return {it:it,avg:'Weekly average',per:'Last 8 weeks'};
    }
    var M=[['May','May',0],['Jun','June',0],['Jul','July',0],['Aug','August',0],['Sep','September',0],['Oct','October',r1(raw[55])]];
    M.forEach(function(m,k){it.push({v:m[2],l:m[0],n:(k===5?'This month, ':'')+m[1]+' 2026'})});
    return {it:it,avg:'Monthly average',per:'Last 6 months'};
  }

  var scrim=$('usageScrim'),openBtn=$('openUsage'),closeBtn=$('closeUsage'),bars=$('bars'),xl=$('xl');
  var tabs=[].slice.call(scrim.querySelectorAll('.seg button')),cols=[],xs=[],data=null;

  function pick(k){
    var it=data.it[k];
    cols.forEach(function(c,j){c.classList.toggle('act',j===k)});
    xs.forEach(function(c,j){c.classList.toggle('act',j===k)});
    $('pickLbl').textContent=it.n;$('pickVal').textContent=fmt(it.v);
  }

  function render(r){
    data=build(r);
    tabs.forEach(function(t){t.setAttribute('aria-selected',t.getAttribute('data-r')===r)});
    $('usageSub').textContent=data.per;
    var vals=data.it.map(function(x){return x.v}),total=vals.reduce(function(a,b){return a+b},0);
    var max=nice(Math.max.apply(null,vals));
    $('y1').textContent=ax(max);$('y2').textContent=ax(max/2);
    $('stTotal').textContent=fmt(r1(total));$('stAvg').textContent=fmt(r1(total/vals.length));$('stAvgLbl').textContent=data.avg;
    bars.innerHTML='';xl.innerHTML='';cols=[];xs=[];
    data.it.forEach(function(it,k){
      var c=document.createElement('button');c.className='col';c.innerHTML='<i></i>';
      c.setAttribute('aria-label',it.n+', '+fmt(it.v));
      c.addEventListener('click',function(){pick(k)});
      bars.appendChild(c);cols.push(c);
      var s=document.createElement('span');s.textContent=it.l;xl.appendChild(s);xs.push(s);
    });
    pick(data.it.length-1);
    function grow(){cols.forEach(function(c,k){c.firstChild.style.height=(data.it[k].v/max*100)+'%'})}
    if(reduce)grow();else requestAnimationFrame(function(){requestAnimationFrame(grow)});
  }

  function open(){scrim.classList.add('open');closeBtn.focus();render('daily')}
  function close(){scrim.classList.remove('open');openBtn.focus()}
  openBtn.addEventListener('click',open);
  closeBtn.addEventListener('click',close);
  tabs.forEach(function(t){t.addEventListener('click',function(){render(t.getAttribute('data-r'))})});
  scrim.addEventListener('click',function(e){if(e.target===scrim)close()});
  document.addEventListener('keydown',function(e){if(e.key==='Escape'&&scrim.classList.contains('open'))close()});
})();
// Navigation + settings (widget switch, night mode)
(function(){
  var $=function(id){return document.getElementById(id)};
  var app=$('app'),home=$('navHome'),sets=$('navSettings'),root=document.documentElement;
  function show(v){
    var s=v==='settings';
    app.classList.toggle('sv',s);
    home.classList.toggle('active',!s);sets.classList.toggle('active',s);
    if(s){sets.setAttribute('aria-current','page');home.removeAttribute('aria-current')}
    else{home.setAttribute('aria-current','page');sets.removeAttribute('aria-current')}
  }
  home.addEventListener('click',function(){show('home')});
  sets.addEventListener('click',function(){show('settings')});
  function load(k){try{return localStorage.getItem(k)}catch(e){return null}}
  function save(k,v){try{localStorage.setItem(k,v)}catch(e){}}
  var wd=$('swWidget'),nt=$('swNight');
  wd.setAttribute('aria-checked',load('mvpn-widget')==='1');
  nt.setAttribute('aria-checked',root.getAttribute('data-theme')==='dark');
  wd.addEventListener('click',function(){
    var v=wd.getAttribute('aria-checked')!=='true';
    wd.setAttribute('aria-checked',v);save('mvpn-widget',v?'1':'0');
    if(window.pywebview && window.pywebview.api && window.pywebview.api.toggle_widget){
      window.pywebview.api.toggle_widget(v);
    }
  });
  nt.addEventListener('click',function(){
    var v=nt.getAttribute('aria-checked')!=='true',t=v?'dark':'light';
    nt.setAttribute('aria-checked',v);root.setAttribute('data-theme',t);save('mvpn-theme',t);
    if(window.pywebview && window.pywebview.api && window.pywebview.api.set_theme){
      window.pywebview.api.set_theme(t);
    }
  });

  window.setWidgetSwitch = function(v){
    wd.setAttribute('aria-checked', v ? 'true' : 'false');
    save('mvpn-widget', v ? '1' : '0');
  };
  window.setThemeSwitch = function(t){
    nt.setAttribute('aria-checked', t === 'dark' ? 'true' : 'false');
    root.setAttribute('data-theme', t);
    save('mvpn-theme', t);
  };
  window.setAppVersion = function(ver){
    var vEl = $('appVersion');
    if(vEl) vEl.textContent = ver;
  };
})();

// Data usage dynamic updates from Python
window.updateTraffic = function(mbUsed, formattedStr, percent){
  window.currentSessionMb = mbUsed || 0;
  var gaugeVal = document.querySelector('.gauge circle.val');
  var gaugePct = document.querySelector('.gauge span');
  var dataText = document.querySelector('.card.data b');
  if(percent !== undefined && gaugeVal && gaugePct){
    var p = Math.min(100, Math.max(0, percent));
    gaugePct.textContent = Math.round(p) + '%';
    var len = (p / 100) * 264;
    gaugeVal.setAttribute('stroke-dasharray', len.toFixed(2) + ' 264');
  }
  if(formattedStr && dataText){
    dataText.textContent = formattedStr;
  }
};

// pywebviewready initialization hook
window.addEventListener('pywebviewready', function(){
  if(window.pywebview && window.pywebview.api && window.pywebview.api.get_initial_state){
    window.pywebview.api.get_initial_state().then(function(state){
      if(!state) return;
      if(state.theme && window.setThemeSwitch) window.setThemeSwitch(state.theme);
      if(state.widget_enabled !== undefined && window.setWidgetSwitch) window.setWidgetSwitch(state.widget_enabled);
      if(state.status && window.setVpnState) window.setVpnState(state.status, state.server_name);
      if(state.server_code && window.setCurrentServer) window.setCurrentServer(state.server_code);
      if(state.version && window.setAppVersion) window.setAppVersion(state.version);
      if(state.data_formatted && window.updateTraffic) window.updateTraffic(state.data_mb, state.data_formatted, state.data_percent);
    }).catch(function(e){ console.error("Error getting initial state:", e); });
  }
});
